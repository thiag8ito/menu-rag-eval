name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: make dataset
      - run: pytest -q
      # regressão do retrieval: o experimento offline roda e a config escolhida mantém hit@5 mínimo no test
      - run: |
          python -m evaluation.run_experiments --embedders tfidf-char --strategies structured \
            --chunk-sizes 512 1024 --headers 1 --hybrids 0 1 --out results/ci
          python - <<'PY'
          import json
          r = json.load(open("results/ci/retrieval_results.json"))[0]
          s = r["metrics"]["clean"]["test"]["hit@5"]
          assert s >= 0.85, f"hit@5 caiu para {s:.3f} em {r['config']}"
          PY
